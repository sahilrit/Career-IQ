# Render Blueprint — the free path. In Render: New -> Blueprint -> pick
# this repo. It provisions a free Postgres, the API, and the web app, and
# redeploys automatically on every push to main (no GitHub Action needed).
#
# Free-tier notes: web services sleep after ~15 min idle (first request
# after that is a slow cold start) and the free Postgres expires after
# 90 days — both fine for validating the product before you spend anything.
#
# After the first deploy, set two values in the Render dashboard:
#   careeros-web -> CAREEROS_API_BASE = the careeros-api public URL
#   careeros-api -> CAREEROS_ADMIN_EMAILS = your email (to get the Admin page)

databases:
  - name: careeros-db
    plan: free

services:
  - type: web
    name: careeros-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CAREEROS_DATABASE_URL
        fromDatabase:
          name: careeros-db
          property: connectionString
      - key: CAREEROS_ADMIN_EMAILS
        sync: false
      - key: CAREEROS_STRIPE_WEBHOOK_SECRET
        sync: false
      # Encrypts stored secrets (e.g. each workspace's Anthropic API key).
      # Auto-generated once and MUST stay stable — rotating it makes every
      # stored key undecryptable.
      - key: CAREEROS_SECRET_KEY
        generateValue: true
      # Optional: override the default Claude model for AI generation.
      - key: CAREEROS_AI_MODEL
        sync: false
      # Stripe Payment Link URLs per paid tier (create them in Stripe →
      # Payment Links, add metadata plan=pro / plan=agency). Until set, the
      # billing page shows "Contact us to upgrade" instead of a pay button.
      - key: CAREEROS_STRIPE_LINK_PRO
        sync: false
      - key: CAREEROS_STRIPE_LINK_AGENCY
        sync: false
      # Public origin of the web app — used to build password-reset links.
      - key: CAREEROS_APP_BASE_URL
        sync: false
      # Transactional email (password reset). Without these, reset links are
      # returned to the caller instead of emailed. Any SMTP provider works.
      - key: CAREEROS_SMTP_HOST
        sync: false
      - key: CAREEROS_SMTP_PORT
        sync: false
      - key: CAREEROS_SMTP_USER
        sync: false
      - key: CAREEROS_SMTP_PASSWORD
        sync: false
      - key: CAREEROS_EMAIL_FROM
        sync: false
      # Shown on the legal pages.
      - key: CAREEROS_COMPANY_NAME
        sync: false
      - key: CAREEROS_SUPPORT_EMAIL
        sync: false
      # Optional error monitoring — set to a Sentry DSN to turn it on.
      - key: CAREEROS_SENTRY_DSN
        sync: false
      # Google integration (Gmail send + Calendar). From Google Cloud →
      # APIs & Services → Credentials → OAuth client (Web application).
      # Inert until both are set.
      - key: CAREEROS_GOOGLE_CLIENT_ID
        sync: false
      - key: CAREEROS_GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: careeros-web
    runtime: docker
    dockerfilePath: ./web/Dockerfile
    dockerContext: ./web
    plan: free
    envVars:
      # Paste the careeros-api public URL here after the first deploy.
      # (Every API call the web app makes is server-to-server, so there is
      # no browser CORS to configure.)
      - key: CAREEROS_API_BASE
        sync: false
