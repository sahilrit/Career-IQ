[project]
name = "careeros"
version = "0.1.0"
description = "CareerOS — AI Career Operating System (workspace root, not published)"
requires-python = ">=3.12"
# Deliberately declared (not just a workspace member): hosts like Streamlit
# Community Cloud run a plain `uv sync` with no flags, which by default only
# installs the root project's own dependencies, not every workspace member.
# Naming the dashboard here makes plain `uv sync` pull in its full transitive
# tree — see docs/development/deploy-streamlit-cloud.md.
dependencies = [
    "careeros-dashboard",
]

[tool.uv]
package = false

[tool.uv.sources]
careeros-dashboard = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    # The API backend (Phase R0) isn't a dependency of the dashboard, so
    # name it here to keep it installed in the shared workspace venv.
    "careeros-api",
    "httpx>=0.27",
    # Browser-gated job providers (docs/plans/browser-gated-sources.md):
    # local-daemon-only by design, deliberately NOT a dependency of
    # careeros-api (Dockerfile.api syncs with --package careeros-api, so
    # this group never reaches the hosted image). scripts/autopilot_daemon.py
    # needs them in the shared dev venv to run locally.
    "careeros-naukri-provider",
    "careeros-gradcracker-provider",
    "careeros-ukvisajobs-provider",
    "careeros-ziprecruiter-provider",
    "careeros-glassdoor-provider",
    # Naukri/Gradcracker/UK Visa Jobs/ZipRecruiter/Glassdoor all need a real
    # anti-detect browser session (careeros_browser.launch_camoufox_session),
    # not just careeros-browser's core (Playwright-only) install. Requesting
    # the extra here, rather than needing `uv sync --extra camoufox` every
    # time, is what keeps a plain `uv sync` leaving these actually runnable —
    # still opt-in for the hosted API image, which syncs with
    # --package careeros-api and never touches this dev group.
    "careeros-browser[camoufox]",
    # The LLM gateway: every AI-backed feature routes through it.
    "careeros-llm",
    # Hosted-ATS discovery: the boards whose forms can actually be filled.
    "careeros-ats-providers",
    # The `careeros` console entry point, and the one freelance gig source -
    # both were workspace members that plain `uv sync` never installed, so
    # their tests silently did not run.
    "careeros-cli",
    "careeros-fiverr-provider",
]

[tool.uv.sources.careeros-api]
workspace = true

[tool.uv.sources.careeros-naukri-provider]
workspace = true

[tool.uv.sources.careeros-gradcracker-provider]
workspace = true

[tool.uv.sources.careeros-ukvisajobs-provider]
workspace = true

[tool.uv.sources.careeros-ziprecruiter-provider]
workspace = true

[tool.uv.sources.careeros-glassdoor-provider]
workspace = true

[tool.uv.sources.careeros-browser]
workspace = true

[tool.uv.sources.careeros-llm]
workspace = true

[tool.uv.sources.careeros-ats-providers]
workspace = true

[tool.uv.sources.careeros-cli]
workspace = true

[tool.uv.sources.careeros-fiverr-provider]
workspace = true

# ---------------------------------------------------------------------------
# Ruff: single source of truth for lint + format across every package.
# Package-level pyproject.toml files do not redeclare these settings.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# These modules exist precisely to map ambiguous Unicode glyphs (smart
# quotes, en/em dashes, non-latin scripts) to safe PDF text, so the
# ambiguous-character lint is noise in them.
"packages/careeros-api/src/careeros_api/resume_pdf.py" = ["RUF001"]
"packages/careeros-api/tests/test_resume_pdf.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["careeros_common"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Pytest: run across the whole workspace from the repo root.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages"]
python_files = ["test_*.py"]
addopts = "--strict-markers --strict-config --import-mode=importlib"
markers = [
    # Drives a real headless Chromium against local ATS-shaped form fixtures.
    # Slower than the rest of the suite (a browser launch, not a fake session)
    # and the only place DOM-level failures - disabled inputs, React-controlled
    # fields, invalid-CSS numeric ids - can actually be reproduced.
    # Skip with: -m "not browser"
    "browser: drives a real headless browser against local form fixtures",
]

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*"]
