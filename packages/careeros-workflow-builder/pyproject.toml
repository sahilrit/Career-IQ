[project]
name = "careeros-workflow-builder"
version = "0.1.0"
description = "Unified Automation & Workflow Builder: no-code WHEN/THEN rules over platform events, dispatching named action chains through a pluggable executor."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-event-bus",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_workflow_builder"]
