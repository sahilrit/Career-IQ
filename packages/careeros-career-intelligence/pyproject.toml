[project]
name = "careeros-career-intelligence"
version = "0.1.0"
description = "Career Intelligence Engine: combines signals from across the platform into ranked recommendations (roles, companies, industries, skills, platforms, ...) and a career direction summary."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_career_intelligence"]
