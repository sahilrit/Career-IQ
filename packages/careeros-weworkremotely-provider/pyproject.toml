[project]
name = "careeros-weworkremotely-provider"
version = "0.1.0"
description = "We Work Remotely FIND_JOBS provider — parses the free public category RSS feeds (weworkremotely.com), strong remote sales/marketing coverage."
requires-python = ">=3.12"
dependencies = ["careeros-common", "careeros-job-providers", "httpx>=0.27"]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_weworkremotely_provider"]
