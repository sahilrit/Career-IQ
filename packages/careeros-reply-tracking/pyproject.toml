[project]
name = "careeros-reply-tracking"
version = "0.1.0"
description = "Post-application reply tracking: read recruiter email and move applications along automatically."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-common",
    "careeros-event-bus",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_reply_tracking"]
