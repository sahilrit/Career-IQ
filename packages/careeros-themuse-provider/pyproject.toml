[project]
name = "careeros-themuse-provider"
version = "0.1.0"
description = "The Muse FIND_JOBS provider — free public jobs API (themuse.com/api/public/jobs) with category and page filters; broad aggregator volume across marketing and more."
requires-python = ">=3.12"
dependencies = ["careeros-common", "careeros-job-providers", "httpx>=0.27"]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_themuse_provider"]
