[project]
name = "careeros-ziprecruiter-provider"
version = "0.1.0"
description = "ZipRecruiter FIND_JOBS provider — via an anti-detect browser (its search page is behind a real Cloudflare challenge, confirmed passable) reading the page's own embedded JSON-LD job listing data. Local-daemon only; not part of the hosted API registry."
requires-python = ">=3.12"
dependencies = [
    "careeros-browser",
    "careeros-common",
    "careeros-job-providers",
]

[tool.uv.sources]
careeros-browser = { workspace = true }
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_ziprecruiter_provider"]
