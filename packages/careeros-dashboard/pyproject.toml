[project]
name = "careeros-dashboard"
version = "0.1.0"
description = "Dashboard / SaaS Control Center: the product UI over the platform — main dashboard, opportunity page, and Career Brain management."
requires-python = ">=3.12"
dependencies = [
    "careeros-calendar-assistant",
    "careeros-career-brain",
    "careeros-client-acquisition",
    "careeros-common",
    "careeros-crm",
    "careeros-employment-division",
    "careeros-financial-intelligence",
    "careeros-offer-negotiation",
    "careeros-opportunity-intelligence",
    "streamlit>=1.38",
]

[tool.uv.sources]
careeros-calendar-assistant = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-client-acquisition = { workspace = true }
careeros-common = { workspace = true }
careeros-crm = { workspace = true }
careeros-employment-division = { workspace = true }
careeros-financial-intelligence = { workspace = true }
careeros-offer-negotiation = { workspace = true }
careeros-opportunity-intelligence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_dashboard"]
