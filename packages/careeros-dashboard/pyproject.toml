[project]
name = "careeros-dashboard"
version = "0.1.0"
description = "Dashboard / SaaS Control Center: the product UI over the platform — main dashboard, opportunity page, and Career Brain management."
requires-python = ">=3.12"
dependencies = [
    "careeros-application-engine",
    "careeros-analytics",
    "careeros-interview-intelligence",
    "careeros-audit-proposal-engine",
    "careeros-arbeitnow-provider",
    "careeros-ashby-provider",
    "careeros-auth",
    "careeros-autopilot",
    "careeros-billing",
    "careeros-browser",
    "careeros-calendar-assistant",
    "careeros-career-brain",
    "careeros-client-acquisition",
    "careeros-ceo-agent",
    "careeros-client-success",
    "careeros-learning-lab",
    "careeros-personal-brand",
    "careeros-common",
    "careeros-crm",
    "careeros-employment-division",
    "careeros-event-bus",
    "careeros-financial-intelligence",
    "careeros-himalayas-provider",
    "careeros-workingnomads-provider",
    "careeros-jobicy-provider",
    "careeros-weworkremotely-provider",
    "careeros-themuse-provider",
    "careeros-lever-provider",
    "careeros-greenhouse-provider",
    "careeros-job-agent",
    "careeros-job-search",
    "careeros-job-discovery",
    "careeros-job-providers",
    "careeros-offer-negotiation",
    "careeros-opportunity-intelligence",
    "careeros-remoteok-provider",
    "careeros-tenancy",
    "careeros-trust-layer",
    "pypdf>=4.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "streamlit>=1.38",
