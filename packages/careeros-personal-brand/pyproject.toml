[project]
name = "careeros-personal-brand"
version = "0.1.0"
description = "Personal Brand Division: turns career activity into public assets (Project -> Case Study -> Portfolio -> LinkedIn Post -> X Thread -> Blog -> Resume Achievement)."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-career-brain-engine",
    "careeros-common",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-career-brain-engine = { workspace = true }
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_personal_brand"]
