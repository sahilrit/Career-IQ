[project]
name = "careeros-common"
version = "0.1.0"
description = "Shared kernel utilities for CareerOS: configuration, logging, and base exceptions."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_common"]
