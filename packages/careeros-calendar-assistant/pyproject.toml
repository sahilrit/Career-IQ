[project]
name = "careeros-calendar-assistant"
version = "0.1.0"
description = "The personal operations layer: extracts interview logistics from email and builds a calendar event + event workspace automatically."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-communication-intelligence",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-communication-intelligence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_calendar_assistant"]
