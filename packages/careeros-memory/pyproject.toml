[project]
name = "careeros-memory"
version = "0.1.0"
description = "CareerOS memory layer: working memory, history logs, analytics, and local semantic search."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-common",
    "careeros-event-bus",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_memory"]
