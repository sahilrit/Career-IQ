[project]
name = "careeros-remoteok-provider"
version = "0.1.0"
description = "RemoteOK FIND_JOBS provider — the reference job-provider implementation, backed by RemoteOK's free public API."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_remoteok_provider"]
