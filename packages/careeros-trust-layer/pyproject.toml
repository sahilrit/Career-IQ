[project]
name = "careeros-trust-layer"
version = "0.1.0"
description = "Security & Trust Layer: general-purpose audit log, consent management, data export/deletion, rate limiting, and a failure queue with recovery — the pieces enterprise readiness needs that earlier phases (tenancy, credentials, autonomy) didn't already cover."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-common",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_trust_layer"]
