[project]
name = "careeros-developer-sdk"
version = "0.1.0"
description = "The official CareerOS Developer SDK: a fluent PluginBuilder, manifest validation, and a package scaffold generator, so a developer can build a plugin without subclassing Plugin/PluginManifest by hand or touching CareerOS Core."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-plugin-sdk",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_developer_sdk"]
