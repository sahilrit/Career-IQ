[project]
name = "careeros-capability-marketplace"
version = "0.1.0"
description = "Capability marketplace: provider ranking, fallback, parallel execution, result aggregation, and versioning on top of the Phase 23 capability registry."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-plugin-sdk",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_capability_marketplace"]
