[project]
name = "careeros-offer-negotiation"
version = "0.1.0"
description = "Offer Evaluation & Negotiation Intelligence: analyzes an offer beyond salary alone and calculates Opportunity Value."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_offer_negotiation"]
