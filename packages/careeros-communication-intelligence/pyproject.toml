[project]
name = "careeros-communication-intelligence"
version = "0.1.0"
description = "Turns incoming email into structured career events: Email -> Classification -> Event -> Workflow. Zero-cost keyword classification; pluggable EmailProvider for a real Gmail integration later."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-event-bus",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_communication_intelligence"]
