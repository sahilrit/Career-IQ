[project]
name = "careeros-career-brain"
version = "0.1.0"
description = "Career Brain: the authoritative source of truth for a user's professional identity."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_career_brain"]
