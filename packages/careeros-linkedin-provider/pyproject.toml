[project]
name = "careeros-linkedin-provider"
version = "0.1.0"
description = "LinkedIn FIND_JOBS provider, backed by LinkedIn's public logged-out job search endpoint."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_linkedin_provider"]
