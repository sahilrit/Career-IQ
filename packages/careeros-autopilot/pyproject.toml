[project]
name = "careeros-autopilot"
version = "0.1.0"
description = "Fully autonomous apply loop: discovers and qualifies jobs, navigates to each live application form, detects fields heuristically (ATS-aware), fills and submits via the browser engine, and hands anything it can't do safely (captchas, login walls) to a human — wired end-to-end from the packages Phases 12-21 shipped."
requires-python = ">=3.12"
dependencies = [
    "careeros-application-engine",
    "careeros-application-runner",
    "careeros-autonomous-execution",
    "careeros-autonomy",
    "careeros-browser",
    "careeros-career-brain",
    "careeros-common",
    "careeros-event-bus",
    "careeros-human-in-the-loop",
    "careeros-job-agent",
    "careeros-job-providers",
    "fpdf2>=2.7",
]

[tool.uv.sources]
careeros-application-engine = { workspace = true }
careeros-application-runner = { workspace = true }
careeros-autonomous-execution = { workspace = true }
careeros-autonomy = { workspace = true }
careeros-browser = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }
careeros-human-in-the-loop = { workspace = true }
careeros-job-agent = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_autopilot"]
