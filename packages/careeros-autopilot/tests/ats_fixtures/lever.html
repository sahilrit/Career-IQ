<!doctype html>
<!-- Lever: a single full-name input, aria-label-only fields, #btn-submit. -->
<html><head><meta charset="utf-8"><title>Performance Marketer — Acme</title></head>
<body>
<form id="application-form">
  <input type="text" name="name" placeholder="Full name" aria-label="Full name" required>
  <input type="email" name="email" placeholder="Email" aria-label="Email" required>
  <input type="tel" name="phone" placeholder="Phone" aria-label="Phone">
  <input type="text" name="urls[LinkedIn]" placeholder="LinkedIn URL" aria-label="LinkedIn URL">
  <input type="file" name="resume" id="resume-upload-input">
  <textarea name="comments" aria-label="Additional information"></textarea>
  <button type="submit" id="btn-submit">Submit application</button>
</form>
</body></html>
