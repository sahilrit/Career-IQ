<!doctype html>
<meta charset="utf-8">
<!-- The application form itself. SmartRecruiters serves this from a different
     origin (oneclick-ui) and embeds it in the posting page, so nothing here is
     reachable by a selector run against the parent document. -->
<title>Apply</title>
<form id="application-form">
  <h2>Apply for this job</h2>
  <label for="sr-first">First Name</label>
  <input type="text" id="sr-first" name="firstName" required>

  <label for="sr-last">Last Name</label>
  <input type="text" id="sr-last" name="lastName" required>

  <label for="sr-email">Email</label>
  <input type="text" id="sr-email" name="email" autocomplete="email" required>

  <label for="sr-phone">Mobile</label>
  <input type="text" id="sr-phone" name="phoneNumber">

  <label for="sr-linkedin">LinkedIn Profile</label>
  <input type="text" id="sr-linkedin" name="linkedinUrl">

  <div class="upload-widget">
    <label for="sr-cv">Upload your CV</label>
    <input type="file" id="sr-cv" name="resume">
    <button type="submit" id="sr-upload">Upload file</button>
  </div>

  <label for="sr-why">Why do you want to work here?</label>
  <textarea id="sr-why" name="question_1"></textarea>

  <button type="submit" id="sr-submit">Submit Application</button>
</form>
