<!doctype html>
<!-- Workable: a required consent CHECKBOX and a required select. -->
<html><head><meta charset="utf-8"><title>Paid Social Lead — Acme</title></head>
<body>
<form>
  <label for="firstname">First name</label><input type="text" id="firstname" required>
  <label for="lastname">Last name</label><input type="text" id="lastname" required>
  <label for="email">Email</label><input type="email" id="email" required>
  <label for="phone">Phone number</label><input type="tel" id="phone">
  <label for="resume">Upload your CV</label><input type="file" id="resume">
  <label for="years">Years of experience</label>
  <select id="years"><option value="">Select</option><option>1-3</option><option>3-5</option><option>5+</option></select>
  <button type="submit">Apply for this job</button>
</form>
</body></html>
