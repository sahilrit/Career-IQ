<!doctype html>
<!-- Shaped like a real Greenhouse application form: split name inputs, a
     resume FILE input whose id is "resume", a cover-letter file input next to
     a cover-letter textarea (the pair that used to make the resume land in the
     wrong slot), and numeric-id custom questions. -->
<html><head><meta charset="utf-8"><title>Growth Marketing Manager — Acme</title></head>
<body>
<h1>Growth Marketing Manager</h1>
<p>Acme is hiring. Long job description goes here so the form sits below the fold.</p>
<form id="application_form">
  <label for="first_name">First Name *</label>
  <input type="text" id="first_name" name="job_application[first_name]" required>

  <label for="last_name">Last Name *</label>
  <input type="text" id="last_name" name="job_application[last_name]" required>

  <label for="email">Email *</label>
  <input type="email" id="email" name="job_application[email]" required>

  <label for="phone">Phone</label>
  <input type="tel" id="phone" name="job_application[phone]">

  <label for="resume">Resume/CV *</label>
  <input type="file" id="resume" name="job_application[resume]">

  <!-- Greenhouse serves the cover letter as a FILE input with this id. -->
  <label for="cover_letter">Cover Letter</label>
  <input type="file" id="cover_letter" name="job_application[cover_letter]">

  <label for="cover_letter_text">Or paste your cover letter</label>
  <textarea id="cover_letter_text" name="job_application[cover_letter_text]"></textarea>

  <label for="4001209002">LinkedIn Profile</label>
  <input type="text" id="4001209002" name="job_application[answers][0]">

  <label for="4001209003">Are you legally authorized to work in the United States?</label>
  <select id="4001209003" name="job_application[answers][1]">
    <option value="">Select...</option>
    <option value="1">Yes</option>
    <option value="0">No</option>
  </select>

  <label for="4001209004">Why are you interested in this role?</label>
  <textarea id="4001209004" name="job_application[answers][2]"></textarea>

  <button type="submit" id="submit_app">Submit Application</button>
</form>
</body></html>
