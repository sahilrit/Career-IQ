<!doctype html>
<meta charset="utf-8">
<!-- The shape that broke the live run: EEO/veteran radio groups. Each radio's
     own label names an OPTION ("Decline to self-identify"), not a question —
     so treating them as separate fields produced eleven unanswerable required
     questions, and then tried to TEXT-FILL a radio, which throws. -->
<title>Apply</title>
<form>
  <label for="first_name">First Name</label><input type="text" id="first_name" required>
  <label for="last_name">Last Name</label><input type="text" id="last_name" required>
  <label for="email">Email</label><input type="text" id="email" autocomplete="email" required>

  <fieldset>
    <legend>Are you legally authorized to work in the United States?</legend>
    <label><input type="radio" name="work_auth" value="yes"> Yes</label>
    <label><input type="radio" name="work_auth" value="no"> No</label>
  </fieldset>

  <fieldset>
    <legend>Race / Ethnicity</legend>
    <label><input type="radio" name="race" value="1"> Hispanic or Latino</label>
    <label><input type="radio" name="race" value="2"> White (Not Hispanic or Latino)</label>
    <label><input type="radio" name="race" value="3"> Black or African American</label>
    <label><input type="radio" name="race" value="4"> Asian (Not Hispanic or Latino)</label>
    <label><input type="radio" name="race" value="5"> Two or More Races</label>
    <label><input type="radio" name="race" value="6"> Decline to self-identify</label>
  </fieldset>

  <fieldset>
    <legend>Veteran status</legend>
    <label><input type="radio" name="veteran" value="a"> I am a veteran</label>
    <label><input type="radio" name="veteran" value="b"> I am not a veteran</label>
    <label><input type="radio" name="veteran" value="c"> Decline to self-identify</label>
  </fieldset>

  <button type="submit" id="submit_app">Submit Application</button>
</form>
