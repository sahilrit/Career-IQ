[project]
name = "careeros-client-success"
version = "0.1.0"
description = "Client Success Division: manages the post-contract freelance client lifecycle (contracts, deliverables, meetings, invoices, upsells, renewals, referrals)."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_client_success"]
