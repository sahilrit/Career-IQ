[project]
name = "careeros-watchlist"
version = "0.1.0"
description = "Company watchlist: monitor named companies' ATS boards and surface newly-posted jobs."
requires-python = ">=3.12"
dependencies = [
    "careeros-ats-providers",
    "careeros-common",
    "careeros-event-bus",
    "careeros-job-providers",
]

[tool.uv.sources]
careeros-ats-providers = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_watchlist"]
