[project]
name = "careeros-observability"
version = "0.1.0"
description = "Observability & Reliability: metrics, tracing, threshold alerting, and failure explanation — filling the gaps Phase 5/9/23/26/45/48's logging, health, and failure-queue mechanisms didn't already cover."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-trust-layer",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-trust-layer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_observability"]
