[project]
name = "careeros-api"
version = "0.1.0"
description = "HTTP API (FastAPI) over the CareerOS domain packages — the backend the React/Next frontend consumes. Thin controllers only: auth, tenant-scoped reads/writes, and the Stripe webhook. No business logic lives here."
requires-python = ">=3.12"
dependencies = [
    "careeros-ai",
    "careeros-application-engine",
    "careeros-audit-proposal-engine",
    "careeros-auth",
    "careeros-billing",
    "careeros-career-brain",
    "careeros-career-intelligence",
    "careeros-ceo-agent",
    "careeros-client-acquisition",
    "careeros-client-success",
    "careeros-common",
    "careeros-credentials",
    "careeros-crm",
    "careeros-financial-intelligence",
    "careeros-interview-intelligence",
    "careeros-job-search",
    "careeros-learning-lab",
    "careeros-offer-negotiation",
    "careeros-opportunity-intelligence",
    "careeros-personal-brand",
    "careeros-tenancy",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "sentry-sdk>=2.0",
]

[tool.uv.sources]
careeros-ai = { workspace = true }
careeros-application-engine = { workspace = true }
careeros-audit-proposal-engine = { workspace = true }
careeros-auth = { workspace = true }
careeros-billing = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-career-intelligence = { workspace = true }
careeros-ceo-agent = { workspace = true }
careeros-client-acquisition = { workspace = true }
careeros-client-success = { workspace = true }
careeros-common = { workspace = true }
careeros-credentials = { workspace = true }
careeros-crm = { workspace = true }
careeros-financial-intelligence = { workspace = true }
careeros-interview-intelligence = { workspace = true }
careeros-job-search = { workspace = true }
careeros-learning-lab = { workspace = true }
careeros-offer-negotiation = { workspace = true }
careeros-opportunity-intelligence = { workspace = true }
careeros-personal-brand = { workspace = true }
careeros-tenancy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_api"]
