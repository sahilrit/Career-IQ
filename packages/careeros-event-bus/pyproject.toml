[project]
name = "careeros-event-bus"
version = "0.1.0"
description = "In-process publish/subscribe event bus decoupling CareerOS plugins and agents."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_event_bus"]
