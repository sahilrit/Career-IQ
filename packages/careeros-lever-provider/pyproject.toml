[project]
name = "careeros-lever-provider"
version = "0.1.0"
description = "Lever FIND_JOBS provider — pulls postings from a configurable list of company Lever boards via the free public v0 postings API. Postings link to open jobs.lever.co application forms (no login, no captcha), so the autopilot can submit."
requires-python = ">=3.12"
dependencies = ["careeros-common", "careeros-job-providers", "httpx>=0.27"]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_lever_provider"]
