[project]
name = "careeros-financial-intelligence"
version = "0.1.0"
description = "Financial Intelligence: tracks salary/freelance/client income, effective hourly rate, and income trends, and compares full-time vs. freelance vs. combined strategy."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-offer-negotiation",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-offer-negotiation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_financial_intelligence"]
