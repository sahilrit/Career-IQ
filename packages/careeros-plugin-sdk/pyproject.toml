[project]
name = "careeros-plugin-sdk"
version = "0.1.0"
description = "Plugin interface, manifests, versioning, and registry for the CareerOS plugin ecosystem."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_plugin_sdk"]
