[project]
name = "careeros-zero-cost-mode"
version = "0.1.0"
description = "Zero-Cost Infrastructure Mode: makes 'no mandatory paid API' an explicit, tested requirement rather than just a convention — a provider cost registry, a workspace dependency audit, and a mode report."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_zero_cost_mode"]
