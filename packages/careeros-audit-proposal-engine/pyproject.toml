[project]
name = "careeros-audit-proposal-engine"
version = "0.1.0"
description = "AI Audit & Proposal Engine: deep Shopify/Meta Ads audits, ROI estimation, and deliverable generation (Loom script, PDF, email, LinkedIn message, proposal)."
requires-python = ">=3.12"
dependencies = [
    "careeros-browser",
    "careeros-career-brain",
    "careeros-client-acquisition",
    "careeros-common",
    "fpdf2>=2.7",
]

[tool.uv.sources]
careeros-browser = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-client-acquisition = { workspace = true }
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_audit_proposal_engine"]
