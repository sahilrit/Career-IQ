[project]
name = "careeros-cli"
version = "0.1.0"
description = "CareerOS command-line interface: Career Brain management, job search, and application package generation."
requires-python = ">=3.12"
dependencies = [
    "careeros-application-engine",
    "careeros-arbeitnow-provider",
    "careeros-career-brain",
    "careeros-common",
    "careeros-event-bus",
    "careeros-job-agent",
    "careeros-job-discovery",
    "careeros-job-providers",
    "careeros-memory",
    "careeros-remoteok-provider",
]

[tool.uv.sources]
careeros-application-engine = { workspace = true }
careeros-arbeitnow-provider = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }
careeros-job-agent = { workspace = true }
careeros-job-discovery = { workspace = true }
careeros-job-providers = { workspace = true }
careeros-memory = { workspace = true }
careeros-remoteok-provider = { workspace = true }

[project.scripts]
careeros = "careeros_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_cli"]
