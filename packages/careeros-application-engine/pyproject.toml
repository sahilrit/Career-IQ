[project]
name = "careeros-application-engine"
version = "0.1.0"
description = "Generates application materials (resume, cover letter, answers, ATS report) from Career Brain — nothing fabricated, no paid AI required."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-career-brain-engine",
    "careeros-common",
    "careeros-job-providers",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-career-brain-engine = { workspace = true }
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_application_engine"]
