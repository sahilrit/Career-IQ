[project]
name = "careeros-analytics"
version = "0.1.0"
description = "Analytics & Career ROI: funnel/platform/industry/network metrics from real platform data, and a transparent Career ROI breakdown."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-client-acquisition",
    "careeros-common",
    "careeros-crm",
    "careeros-financial-intelligence",
    "careeros-offer-negotiation",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-client-acquisition = { workspace = true }
careeros-common = { workspace = true }
careeros-crm = { workspace = true }
careeros-financial-intelligence = { workspace = true }
careeros-offer-negotiation = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_analytics"]
