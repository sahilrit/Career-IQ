[project]
name = "careeros-plugin-marketplace"
version = "0.1.0"
description = "Plugin Marketplace: a browsable catalog on top of Phase 3's PluginRegistry, an adapter for wrapping existing providers as installable plugins, and per-plugin health reporting."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-core",
    "careeros-plugin-sdk",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-core = { workspace = true }
careeros-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_plugin_marketplace"]
