[project]
name = "careeros-job-search"
version = "0.1.0"
description = "App-composition layer for job discovery: the default provider registry (aggregators + nine hosted ATSes) plus search_for_jobs / generate_application_for_job. Shared by the Streamlit dashboard and the FastAPI backend so neither duplicates provider wiring."
requires-python = ">=3.12"
dependencies = [
    "careeros-adzuna-provider",
    "careeros-application-engine",
    "careeros-arbeitnow-provider",
    "careeros-ats-providers",
    "careeros-career-brain",
    "careeros-common",
    "careeros-event-bus",
    "careeros-golangjobs-provider",
    "careeros-hiringcafe-provider",
    "careeros-himalayas-provider",
    "careeros-job-agent",
    "careeros-job-discovery",
    "careeros-job-providers",
    "careeros-jobicy-provider",
    "careeros-linkedin-provider",
    "careeros-remoteok-provider",
    "careeros-seek-provider",
    "careeros-themuse-provider",
    "careeros-weworkremotely-provider",
    "careeros-workingnomads-provider",
]

[tool.uv.sources]
careeros-adzuna-provider = { workspace = true }
careeros-application-engine = { workspace = true }
careeros-arbeitnow-provider = { workspace = true }
careeros-ats-providers = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }
careeros-golangjobs-provider = { workspace = true }
careeros-hiringcafe-provider = { workspace = true }
careeros-himalayas-provider = { workspace = true }
careeros-job-agent = { workspace = true }
careeros-job-discovery = { workspace = true }
careeros-job-providers = { workspace = true }
careeros-jobicy-provider = { workspace = true }
careeros-linkedin-provider = { workspace = true }
careeros-remoteok-provider = { workspace = true }
careeros-seek-provider = { workspace = true }
careeros-themuse-provider = { workspace = true }
careeros-weworkremotely-provider = { workspace = true }
careeros-workingnomads-provider = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_job_search"]
