[project]
name = "careeros-beta"
version = "0.1.0"
description = "Beta Release: a real readiness check across the MVP's required subsystems, plus a capacity-limited invite cohort for starting with a limited number of users."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_beta"]
