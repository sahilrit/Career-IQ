[project]
name = "careeros-career-brain-engine"
version = "0.1.0"
description = "Career Brain intelligence: profile matching, resume/achievement relevance, experience analysis, and rule-based recommendations."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-common",
    "careeros-job-providers",
    "careeros-memory",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }
careeros-memory = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_career_brain_engine"]
