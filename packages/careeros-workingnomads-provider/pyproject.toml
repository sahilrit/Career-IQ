[project]
name = "careeros-workingnomads-provider"
version = "0.1.0"
description = "Working Nomads FIND_JOBS provider — free public remote-jobs feed (workingnomads.com/api/exposed_jobs)."
requires-python = ">=3.12"
dependencies = ["careeros-common", "careeros-job-providers", "httpx>=0.27"]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_workingnomads_provider"]
