[project]
name = "careeros-jobicy-provider"
version = "0.1.0"
description = "Jobicy FIND_JOBS provider — free public remote-jobs API (jobicy.com/api/v2/remote-jobs), strong marketing/DTC coverage."
requires-python = ">=3.12"
dependencies = ["careeros-common", "careeros-job-providers", "httpx>=0.27"]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_jobicy_provider"]
