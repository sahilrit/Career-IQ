[project]
name = "careeros-ceo-agent"
version = "0.1.0"
description = "Executive AI / CEO Agent: allocates effort across Employment, Freelance, Networking, and Personal Brand based on real, sourced performance evidence, and tracks how the allocation changes over time."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_ceo_agent"]
