[project]
name = "careeros-interview-intelligence"
version = "0.1.0"
description = "Timed interview briefings (48h/24h/2h before): research checklist, question prep with STAR prompts, and a one-page briefing — all sourced from real Career Brain data."
requires-python = ">=3.12"
dependencies = [
    "careeros-calendar-assistant",
    "careeros-career-brain",
    "careeros-career-brain-engine",
    "careeros-common",
    "careeros-event-bus",
]

[tool.uv.sources]
careeros-calendar-assistant = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-career-brain-engine = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_interview_intelligence"]
