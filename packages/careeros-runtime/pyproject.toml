[project]
name = "careeros-runtime"
version = "0.1.0"
description = "Runtime infrastructure: worker pool, task queue, scheduler, lifecycle, and health for 24/7 operation."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_runtime"]
