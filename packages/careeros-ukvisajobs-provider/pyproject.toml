[project]
name = "careeros-ukvisajobs-provider"
version = "0.1.0"
description = "UK Visa Jobs FIND_JOBS provider — visa-sponsorship roles, via credentialed login (real anti-detect browser for the login, plain HTTP for the paginated search API). Local-daemon only; not part of the hosted API registry."
requires-python = ">=3.12"
dependencies = [
    "careeros-browser",
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-browser = { workspace = true }
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_ukvisajobs_provider"]
