[project]
name = "careeros-autonomous-agency"
version = "0.1.0"
description = "Autonomous Career Agency: the final capstone loop — Employment/Freelance/Personal Brand -> Networking -> Client Success -> Financial Intelligence -> Career Intelligence -> CEO Agent -> Learning, tracked continuously per user, composing every earlier phase rather than adding new business logic."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-event-bus",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_autonomous_agency"]
