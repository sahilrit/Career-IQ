[project]
name = "careeros-opportunity-intelligence"
version = "0.1.0"
description = "Unifies employment and freelance postings into one Opportunity abstraction, with unified scoring, lightweight client CRM, and proposal generation."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-career-brain-engine",
    "careeros-common",
    "careeros-freelance-providers",
    "careeros-job-providers",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-career-brain-engine = { workspace = true }
careeros-common = { workspace = true }
careeros-freelance-providers = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_opportunity_intelligence"]
