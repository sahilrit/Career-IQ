[project]
name = "careeros-himalayas-provider"
version = "0.1.0"
description = "Himalayas FIND_JOBS provider — backed by Himalayas' free public remote-jobs API (100k+ postings, no API key), adding real non-tech volume (marketing, sales, ops) to the FIND_JOBS pool."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_himalayas_provider"]
