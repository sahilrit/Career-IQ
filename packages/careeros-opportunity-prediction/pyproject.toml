[project]
name = "careeros-opportunity-prediction"
version = "0.1.0"
description = "Opportunity Prediction Engine: predicts likely demand from real company signals before an opportunity is posted, and tracks positioning progress."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_opportunity_prediction"]
