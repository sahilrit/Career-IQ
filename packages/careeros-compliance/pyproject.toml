[project]
name = "careeros-compliance"
version = "0.1.0"
description = "Security / Compliance / Data Portability: retention policies, security policies, full-account deletion, and a compliance readiness report — filling what Phase 25's tenancy, Phase 26's credentials, and Phase 45's trust layer didn't already cover."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-tenancy",
    "careeros-trust-layer",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-tenancy = { workspace = true }
careeros-trust-layer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_compliance"]
