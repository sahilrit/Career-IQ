[project]
name = "careeros-crm"
version = "0.1.0"
description = "CRM & Relationship Intelligence: tracks every contact (recruiters, founders, CMOs, hiring managers, agency owners, clients, prospects) through a relationship timeline."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-event-bus",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_crm"]
