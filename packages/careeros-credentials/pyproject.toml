[project]
name = "careeros-credentials"
version = "0.1.0"
description = "Credential & secret management: encrypted vault, OAuth token lifecycle, per-plugin permission checks, and audit logging. Agent != credential owner."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "cryptography>=42",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_credentials"]
