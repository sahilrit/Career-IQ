[project]
name = "careeros-autonomous-execution"
version = "0.1.0"
description = "Connects the autonomous decision system (Phase 21) to the real browser application engine: the full discover -> authorize -> submit -> verify loop."
requires-python = ">=3.12"
dependencies = [
    "careeros-application-engine",
    "careeros-application-intelligence",
    "careeros-application-runner",
    "careeros-autonomy",
    "careeros-browser",
    "careeros-career-brain",
    "careeros-common",
    "careeros-event-bus",
    "careeros-human-in-the-loop",
    "careeros-job-providers",
]

[tool.uv.sources]
careeros-application-engine = { workspace = true }
careeros-application-intelligence = { workspace = true }
careeros-application-runner = { workspace = true }
careeros-autonomy = { workspace = true }
careeros-browser = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }
careeros-human-in-the-loop = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_autonomous_execution"]
