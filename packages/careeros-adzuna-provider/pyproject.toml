[project]
name = "careeros-adzuna-provider"
version = "0.1.0"
description = "Adzuna FIND_JOBS provider — official multi-country jobs API, free developer key."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_adzuna_provider"]
