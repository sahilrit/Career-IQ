[project]
name = "careeros-onboarding"
version = "0.1.0"
description = "Multi-User Production SaaS: tracks each user's real progress through Signup -> Career Brain setup -> Connect accounts -> Choose capabilities -> Configure autonomy -> Start CareerOS, so every user gets their own AI career agency."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_onboarding"]
