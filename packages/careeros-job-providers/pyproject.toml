[project]
name = "careeros-job-providers"
version = "0.1.0"
description = "Standardized FIND_JOBS provider SDK: normalization, filtering, dedup, and a provider registry."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_job_providers"]
