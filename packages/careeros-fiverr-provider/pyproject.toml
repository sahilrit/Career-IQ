[project]
name = "careeros-fiverr-provider"
version = "0.1.0"
description = "A second FIND_GIGS provider proving the freelance provider architecture works across marketplaces, browser-driven since Fiverr has no free public API."
requires-python = ">=3.12"
dependencies = [
    "careeros-browser",
    "careeros-common",
    "careeros-freelance-providers",
]

[tool.uv.sources]
careeros-browser = { workspace = true }
careeros-common = { workspace = true }
careeros-freelance-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_fiverr_provider"]
