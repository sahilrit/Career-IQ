[project]
name = "careeros-arbeitnow-provider"
version = "0.1.0"
description = "Arbeitnow FIND_JOBS provider — a second job-provider implementation, backed by Arbeitnow's free public job board API, proving the FIND_JOBS SDK generalizes beyond RemoteOK."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_arbeitnow_provider"]
