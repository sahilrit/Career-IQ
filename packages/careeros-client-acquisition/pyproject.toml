[project]
name = "careeros-client-acquisition"
version = "0.1.0"
description = "Freelance Client Acquisition Division: Company Discovery -> Qualification -> Problem Detection -> Opportunity Score -> Audit -> Outreach -> Follow-up -> Proposal -> Call -> Contract -> Client."
requires-python = ">=3.12"
dependencies = [
    "careeros-browser",
    "careeros-career-brain",
    "careeros-career-brain-engine",
    "careeros-common",
    "careeros-event-bus",
    "careeros-opportunity-intelligence",
]

[tool.uv.sources]
careeros-browser = { workspace = true }
careeros-career-brain = { workspace = true }
careeros-career-brain-engine = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }
careeros-opportunity-intelligence = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_client_acquisition"]
