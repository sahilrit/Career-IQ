[project]
name = "careeros-naukri-provider"
version = "0.1.0"
description = "Naukri FIND_JOBS provider — India's largest job board, via anti-detect browser + XHR capture. Local-daemon only; not part of the hosted API registry."
requires-python = ">=3.12"
dependencies = [
    "careeros-browser",
    "careeros-common",
    "careeros-job-providers",
]

[tool.uv.sources]
careeros-browser = { workspace = true }
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_naukri_provider"]
