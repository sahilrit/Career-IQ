[project]
name = "careeros-greenhouse-provider"
version = "0.1.0"
description = "Greenhouse FIND_JOBS provider — pulls postings from a configurable list of company Greenhouse boards via the free public boards API. Unlike aggregators, these link to OPEN hosted application forms (no login, no captcha), so the autopilot can actually submit — and the API exposes each posting's real application questions."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_greenhouse_provider"]
