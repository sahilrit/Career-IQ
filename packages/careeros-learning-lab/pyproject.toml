[project]
name = "careeros-learning-lab"
version = "0.1.0"
description = "AI Learning Lab: A/B experiments across resume, email, LinkedIn, portfolio, proposal, and subject line content, measuring real outcomes to learn what works best."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_learning_lab"]
