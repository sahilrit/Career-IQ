[project]
name = "careeros-job-agent"
version = "0.1.0"
description = "Autonomous job agent: Career Brain -> Discovery -> Matching -> Scoring -> Prioritization -> Action."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-common",
    "careeros-event-bus",
    "careeros-job-discovery",
    "careeros-job-providers",
    "careeros-runtime",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }
careeros-job-discovery = { workspace = true }
careeros-job-providers = { workspace = true }
careeros-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_job_agent"]
