[project]
name = "careeros-seek-provider"
version = "0.1.0"
description = "Seek FIND_JOBS provider — Australia/NZ's largest job board, via its own public JSON search API (no key, no browser needed)."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_seek_provider"]
