[project]
name = "careeros-llm"
version = "0.1.0"
description = "LLM Gateway: provider-agnostic AI access with task routing, fallback and health checks."
requires-python = ">=3.12"
dependencies = ["careeros-ai", "careeros-common", "pydantic>=2.7"]

[tool.uv.sources]
careeros-ai = { workspace = true }
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_llm"]
