[project]
name = "careeros-gradcracker-provider"
version = "0.1.0"
description = "Gradcracker FIND_JOBS provider — UK graduate STEM roles, via anti-detect browser. Local-daemon only; not part of the hosted API registry."
requires-python = ">=3.12"
dependencies = [
    "careeros-browser",
    "careeros-common",
    "careeros-job-providers",
]

[tool.uv.sources]
careeros-browser = { workspace = true }
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_gradcracker_provider"]
