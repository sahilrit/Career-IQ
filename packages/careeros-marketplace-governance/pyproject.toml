[project]
name = "careeros-marketplace-governance"
version = "0.1.0"
description = "Marketplace Governance: manifest/version/permission/dependency/security checks a plugin must pass before distribution, plus version history and rollback."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-developer-sdk",
    "careeros-plugin-sdk",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-developer-sdk = { workspace = true }
careeros-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_marketplace_governance"]
