[project]
name = "careeros-auth"
version = "0.1.0"
description = "Account authentication for the hosted SaaS: password hashing (stdlib PBKDF2), signup that provisions the full tenancy chain (User -> Organization -> Workspace -> Membership -> Free subscription), login with lockout, and expiring session tokens."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-tenancy",
    "careeros-billing",
    "careeros-compliance",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-tenancy = { workspace = true }
careeros-billing = { workspace = true }
careeros-compliance = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_auth"]
