[project]
name = "careeros-job-discovery"
version = "0.1.0"
description = "The end-to-end job discovery pipeline: discover -> normalize -> dedupe -> score -> store -> emit."
requires-python = ">=3.12"
dependencies = [
    "careeros-career-brain",
    "careeros-common",
    "careeros-event-bus",
    "careeros-job-providers",
]

[tool.uv.sources]
careeros-career-brain = { workspace = true }
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_job_discovery"]
