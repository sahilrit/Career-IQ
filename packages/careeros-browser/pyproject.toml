[project]
name = "careeros-browser"
version = "0.1.0"
description = "Browser automation abstraction (Playwright-backed, free and open-source) for sites with no useful free API."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "playwright>=1.40,<1.59",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Anti-detect Firefox for sites behind Cloudflare/Akamai (Naukri, Gradcracker).
# Optional: never required just to import careeros_browser, and importing this
# package never fails without it — only launch_camoufox_session() does, with a
# clear error. Install with `uv sync --extra camoufox` then
# `python3 -m camoufox fetch` to download the browser binary (also optional,
# free, one-time).
camoufox = ["camoufox[geoip]>=0.4"]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_browser"]
