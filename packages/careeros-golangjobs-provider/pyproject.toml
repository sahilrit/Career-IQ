[project]
name = "careeros-golangjobs-provider"
version = "0.1.0"
description = "Golang Jobs FIND_JOBS provider — the golangjobs.tech board via its public Supabase REST API."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-job-providers",
    "httpx>=0.27",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-job-providers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_golangjobs_provider"]
