[project]
name = "careeros-tenancy"
version = "0.1.0"
description = "SaaS identity and multi-tenancy: User/Organization/Workspace/Membership/Role, and the TenantScopedDocumentStore that guarantees customer A can never access customer B's data."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "pydantic>=2.7",
]

[dependency-groups]
# careeros-career-brain is not a runtime dependency of tenancy (tenancy
# is domain-agnostic) — it's only used by one integration test that
# proves TenantScopedDocumentStore isolates an already-shipped,
# unmodified repository, not just a toy example.
test = ["careeros-career-brain"]

[tool.uv]
default-groups = ["test"]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-career-brain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_tenancy"]
