[project]
name = "careeros-billing"
version = "0.1.0"
description = "SaaS Billing & Plans: the Free/Pro/Agency plan model, feature gating, and subscription state tracking — a monetization layer, never a dependency of the core platform. No real payment processor is integrated; that would plug in as an optional provider behind this state-tracking layer."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
]

[tool.uv.sources]
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_billing"]
