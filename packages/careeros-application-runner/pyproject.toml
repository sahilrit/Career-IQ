[project]
name = "careeros-application-runner"
version = "0.1.0"
description = "Turns an application package into an actual browser form submission, with validation, screenshots, and retries."
requires-python = ">=3.12"
dependencies = [
    "careeros-application-engine",
    "careeros-browser",
    "careeros-common",
]

[tool.uv.sources]
careeros-application-engine = { workspace = true }
careeros-browser = { workspace = true }
careeros-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_application_runner"]
