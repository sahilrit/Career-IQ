[project]
name = "careeros-core"
version = "0.1.0"
description = "Platform core: generic capability registry, platform health aggregation, shared execution context, and event contracts."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-event-bus",
    "pydantic>=2.7",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-event-bus = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_core"]
