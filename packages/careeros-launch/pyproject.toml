[project]
name = "careeros-launch"
version = "0.1.0"
description = "Production Launch: a real readiness gate over the platform's architectural properties (multi-tenant, plugin-based, event-driven, autonomous, memory-driven, AI-powered, browser-capable, SaaS-ready, zero-paid-API dependent) plus a launch record."
requires-python = ">=3.12"
dependencies = [
    "careeros-common",
    "careeros-zero-cost-mode",
]

[tool.uv.sources]
careeros-common = { workspace = true }
careeros-zero-cost-mode = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careeros_launch"]
