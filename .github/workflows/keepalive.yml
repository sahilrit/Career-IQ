name: Keep-alive

# Pings the live services so the free tier doesn't spin down — this
# removes the ~50s cold-start 502 on the first visit after idle.
#
# Trade-off: keeping a free Render service awake consumes its monthly
# instance-hours (750/mo per service). One always-on service ≈ 720 hrs,
# just under the cap. If you add more services or hit the cap, widen the
# interval below or let it sleep. Edit the URLs if yours differ.
#
# Override the URLs without editing this file by setting repo *variables*
# WEB_URL and API_URL (Settings → Secrets and variables → Actions → Variables).

on:
  schedule:
    # Every 10 min. Render free tier sleeps after ~15 min idle, and GitHub's
    # scheduled runs are often delayed several minutes — 10 leaves margin so a
    # slipped run still lands before the 15-min spin-down. (Private repos: this
    # is ~4300 Actions-min/mo, over the 2000 free minutes; widen if that bites.)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health
        run: |
          URL="${{ vars.API_URL || 'https://careeros-api-aplu.onrender.com' }}/health"
          echo "GET $URL"
          curl -fsS --max-time 60 --retry 2 "$URL" || echo "api ping failed (will retry next run)"
      - name: Ping web
        run: |
          URL="${{ vars.WEB_URL || 'https://careeros-web-1tor.onrender.com' }}"
          echo "GET $URL"
          curl -fsS --max-time 60 --retry 2 "$URL" > /dev/null || echo "web ping failed (will retry next run)"
