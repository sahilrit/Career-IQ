name: Deploy

# Fires only after the CI workflow finishes **successfully** on main, so
# nothing deploys unless lint, tests (incl. the live-Postgres store test),
# and both Docker builds are green.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  fly:
    # Skip unless CI passed AND a Fly token is configured. With no
    # FLY_API_TOKEN secret the job is a clean no-op — safe for anyone not
    # using Fly (e.g. if you deploy on Render/Vercel, which auto-deploy on
    # push natively and need no Action).
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        if: ${{ env.FLY_API_TOKEN != '' }}
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --config fly.api.toml --dockerfile Dockerfile.api --remote-only

      - name: Deploy web
        if: ${{ env.FLY_API_TOKEN != '' }}
        working-directory: web
        run: flyctl deploy --config fly.toml --dockerfile Dockerfile --remote-only

      - name: Note when unconfigured
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "No FLY_API_TOKEN secret set — skipping Fly deploy. (Render/Vercel auto-deploy on push instead.)"
