name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest

    # A real Postgres so the store-factory's gated test actually exercises
    # PostgresDocumentStore (skipped locally where no DB is available).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: careeros
          POSTGRES_PASSWORD: careeros
          POSTGRES_DB: careeros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careeros"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pytest (incl. live Postgres store)
        env:
          CAREEROS_TEST_DATABASE_URL: postgresql://careeros:careeros@localhost:5432/careeros_test
        run: uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f Dockerfile.api -t careeros-api:ci .

      - name: Build web image
        run: docker build -f web/Dockerfile -t careeros-web:ci ./web
